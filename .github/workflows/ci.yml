name: Dekopen CI Pipeline

on:
  push:
    branches: [main]
  # Every pull request runs the gate — stacked PRs that target feature
  # branches must not bypass the checks main's protection relies on.
  pull_request:

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js 24.15
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Verify generated API tree is clean
        run: git diff --exit-code -- backend/openapi.yaml frontend/src/api/generated/

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js 24.15
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install WeasyPrint native libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig1 libharfbuzz0b libharfbuzz-subset0 \
            libpango-1.0-0 libpangoft2-1.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend

      - name: Run test suites
        run: make test

      - name: Run formula mutation drill
        run: make test-mutations

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js 24.15
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build production frontend
        run: make build

  ai-evals-mock:
    name: AI Evals (MOCK, non-blocking)
    runs-on: ubuntu-latest
    # Diagnóstico IA1: suite determinista que mide la IA por resultado. Nunca
    # bloquea el merge — sus fallos son el diagnóstico, no un defecto de build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js 24.15
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend

      - name: Run AI evals (MOCK provider)
        run: make test-ai-evals

      - name: Upload eval report
        uses: actions/upload-artifact@v5
        with:
          name: ai-evals-mock
          path: docs/ai/evals/ci-mock.json
          retention-days: 30

  database-gate:
    name: Database Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js 24.15
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Supabase CLI 2.116.0
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.116.0

      - name: Install WeasyPrint native libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig1 libharfbuzz0b libharfbuzz-subset0 \
            libpango-1.0-0 libpangoft2-1.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Live DB gate (pgTAP, RLS integration, auth e2e, PostgreSQL 16)
        env:
          POSTGRES16_CONTAINER: ${{ job.services.postgres16.id }}
        run: make test-db

    services:
      postgres16:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
