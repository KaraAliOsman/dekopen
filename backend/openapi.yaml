components:
  schemas:
    AalEnum:
      enum:
      - aal1
      - aal2
      type: string
      description: |-
        * `aal1` - aal1
        * `aal2` - aal2
    AccessoryLine:
      type: object
      properties:
        obligation_id:
          type: string
          maxLength: 200
        obligation_kind:
          $ref: '#/components/schemas/ObligationKindEnum'
        technical_sku:
          type: string
          maxLength: 200
        purchasing_sku:
          type: string
          maxLength: 200
        manufacturer_name:
          type: string
          maxLength: 300
        order_type:
          $ref: '#/components/schemas/OrderTypeEnum'
        unit:
          allOf:
          - $ref: '#/components/schemas/AccessoryLineUnitEnum'
          default: EA
        quantity_per_position_unit:
          type: integer
          minimum: 1
        description:
          type: string
          maxLength: 1000
      required:
      - description
      - manufacturer_name
