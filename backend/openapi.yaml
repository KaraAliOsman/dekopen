openapi: 3.0.3
info:
  title: Dekopen API
  version: 1.0.0
  description: Authenticated tenant and engine API boundary.
paths:
  /api/v1/ai/agent/:
    post:
      operationId: ai_agent
      description: |-
        The agent surface: a goal becomes a bounded observe → plan → propose
        loop. Queries run server-side inside typed projections; every emitted
        step is validated before it reaches the client, and nothing consequential
        executes without the human clicking on the real surface.
      parameters:
      - in: header
        name: X-Organization-ID
        schema:
          type: string
          format: uuid
        description: Active organization; validated against the JWT user's active
          memberships.
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAgentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AiAgentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AiAgentRequestRequest'
        required: true
      security:
      - SupabaseBearer: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAgentAccepted'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/ai/ask/:
    get:
      operationId: ai_ask_thread
      description: |-
        The durable ask thread for this context — the dock restores it
        after reload so a conversation survives instead of resetting.
      parameters:
      - in: header
        name: X-Organization-ID
        schema:
          type: string
          format: uuid
        description: Active organization; validated against the JWT user's active
          memberships.
      - in: query
        name: refs
        schema:
          type: string
        description: Context refs as a JSON object — the same identifier map the ask
          call carries.
        required: true
      - in: query
        name: surface
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - SupabaseBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiAskTurn'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '422':
