          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    post:
      operationId: ai_ask
      description: |-
        Contextual "Preguntar a DEKOPEN" — the question and surface come from
        the client; every fact in the context is queried server-side under the
        caller's RLS. The provider answers inside that projection only.
      parameters:
      - in: header
        name: X-Organization-ID
        schema:
          type: string
          format: uuid
        description: Active organization; validated against the JWT user's active
          memberships.
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAskRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AiAskRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AiAskRequestRequest'
        required: true
      security:
      - SupabaseBearer: []
      responses:
        '200':
