  /api/v1/ai/jobs/:
    get:
      operationId: ai_job_list
      description: The caller's recent AI jobs — the workspace's left rail.
      parameters:
      - in: query
        name: before
        schema:
          type: string
          format: date-time
        description: 'Cursor: return jobs created before this timestamp (the last
          row''s created_at) — older pages of the job rail.'
      - in: query
        name: before_id
        schema:
          type: string
          format: uuid
        description: 'Tie-breaker: the last row''s id — jobs sharing the cursor''s
          timestamp paginate by id so nothing falls between pages.'
      tags:
      - ai
      security:
      - SupabaseBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
