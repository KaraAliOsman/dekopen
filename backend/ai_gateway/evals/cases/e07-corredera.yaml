id: E07
view: editor
via: design_assist
surface: position
fixture: editor
product_variant: vacia
prompt: "conviértela en corredera de dos hojas"
expected: "set_system a la serie corredera del catálogo, o explica la incompatibilidad y propone sistema compatible."
expect:
  any:
    # IA2 — el catálogo expone la serie corredera: set_system es la op
    # honesta para "conviértela en corredera".
