project_id = "dekopen"

[api]
enabled = true
# Local ports below Windows' dynamic/excluded ephemeral ranges.
port = 25321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 25322
shadow_port = 25320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = false

[local_smtp]
enabled = true
port = 25324
smtp_port = 25325
pop3_port = 25326

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173/auth/callback",
  "http://localhost:5173/auth/callback",
]
jwt_expiry = 3600
enable_signup = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
email_sent = 100

[edge_runtime]
enabled = false

[analytics]
enabled = false
